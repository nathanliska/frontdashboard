services:
  frontend:
    container_name: frontdashboard-frontend
    image: ghcr.io/nathanliska/frontdashboard-frontend:${TAG:-latest}
    # Started, not healthy: Caddy resolves the upstream per request, so it only needs DNS. Waiting
    # on health stalls every restart and serves nothing meanwhile, instead of shell plus a 502.
    depends_on:
      backend:
        condition: service_started
    # Caddy carries no capability, so :80 binds on this alone. Docker already defaults it to 0;
    # setting it makes that the container's guarantee rather than the daemon's.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal
      - edge
    restart: unless-stopped

  # Bundled rather than shared with the box's other apps, which is what Immich and Paperless do too:
  # on the internal network with no published port, isolation needs no ACL to enforce it.
  redis:
    container_name: frontdashboard-redis
    image: redis:8-alpine
    # Insurance, not a working limit: counters expire on their own and the stream is capped by
    # MAXLEN, so `noeviction` can never bite — and evicting a rate-limit key resets an abuse window.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  backend:
    container_name: frontdashboard-backend
    image: ghcr.io/nathanliska/frontdashboard-backend:${TAG:-latest}
    pull_policy: always
    # Started, not healthy: an unreachable Redis already degrades rather than fails, so this only
    # buys a resolvable name — worth having, since resolving one that does not exist costs ~4s.
    depends_on:
      redis:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Empty by default — the Origin allowlist is FRONTEND_BASE_URL plus this. Passed through so
      # a second hostname needs no edit here.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Inert — the container runs one worker. Passed through so raising it warns rather than
      # quietly doing nothing; scaling by replica also needs `container_name` dropped above.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      # Override only to point at an external instance; the bundled one is the supported shape.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    external: true
  edge:
    external: true
