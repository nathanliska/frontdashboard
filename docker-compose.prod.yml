services:
  frontend:
    container_name: frontdashboard-frontend
    image: heatslinger/frontdashboard-frontend:${TAG:-latest}
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal
      - edge
    restart: unless-stopped

  backend:
    container_name: frontdashboard-backend
    image: heatslinger/frontdashboard-backend:${TAG:-latest}
    pull_policy: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGINS: ""
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    external: true
  edge:
    external: true
