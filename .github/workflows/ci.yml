name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow:
    name: Workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2.1.2
        with:
          version: "1.7.12"
          pyflakes: false
      # The prod stack is never exercised by CI otherwise, so a typo in it surfaces at deploy.
      # Values are dummies: this validates structure, not configuration.
      - name: Validate the production Compose file
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
          FRONTEND_BASE_URL: https://example.invalid
          RESEND_API_KEY: ci
          EMAIL_FROM: ci@example.invalid
        run: docker compose -f docker-compose.prod.yml config --quiet

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      # ENVIRONMENT is required (no default) — CI has no .env, so provide it inline.
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          working-directory: backend
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run deptry .
      - run: uv run pytest
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      # The frontend prod image was already built here; the backend one never was, so a broken
      # Dockerfile.prod only surfaced at deploy time. Same job, no extra runner.
      - name: Build production backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          file: backend/Dockerfile.prod
          push: false
          load: true
          tags: frontdashboard-backend:ci
          cache-from: type=gha,scope=frontdashboard-backend
          cache-to: type=gha,mode=max,scope=frontdashboard-backend
      # A USER line is easy to drop in a refactor and nothing else would notice, so assert it.
      - name: Assert the production image does not run as root
        run: |
          uid=$(docker run --rm frontdashboard-backend:ci id -u)
          echo "production image runs as uid $uid"
          test "$uid" != "0"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run knip
      # `tsc --build` (not `--noEmit`): the root tsconfig is a solution file with `files: []`,
      # so a plain `tsc --noEmit` type-checks nothing and always passes. `vite build` is
      # transpile-only, so this is the only step that actually checks types.
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
      # Folded in from a separate job: this needs both toolchains, and the frontend job is the
      # shorter of the two, so uv lands here rather than npm ci landing on the backend job.
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          working-directory: backend
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --frozen
        working-directory: backend
      - name: Contract is in sync with the backend schema
        # app.openapi() is schema-only — no DB connection is opened, but Settings() still
        # requires these to be set (no defaults) for app.main to import.
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
          ENVIRONMENT: development
        working-directory: .
        run: |
          make contracts
          git diff --exit-code frontend/src/api/generated/contract.ts
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build production frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: frontend/Dockerfile.prod
          push: false
          load: true
          tags: frontdashboard-frontend:ci
          cache-from: type=gha,scope=frontdashboard-frontend
          cache-to: type=gha,mode=max,scope=frontdashboard-frontend
      # Mirrors the backend assertion. This image is the more fragile of the two: it binds :80 via
      # a file capability, so losing either the USER line or the setcap silently returns it to root.
      - name: Assert the production image does not run as root
        run: |
          uid=$(docker run --rm frontdashboard-frontend:ci id -u)
          echo "production image runs as uid $uid"
          test "$uid" != "0"
