name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # Keep checkout on a Node 24-capable release to avoid runner deprecation warnings.
      - uses: actions/checkout@v5.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          # Cache the uv dependency/artifact cache keyed by backend inputs.
          enable-cache: true
          working-directory: backend
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Testcontainers spins up its own DB — these satisfy pydantic-settings at import time only
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      SECRET_KEY: ci-secret-key
    steps:
      # Keep checkout on a Node 24-capable release to avoid runner deprecation warnings.
      - uses: actions/checkout@v5.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          # Cache the uv dependency/artifact cache keyed by backend inputs.
          enable-cache: true
          working-directory: backend
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --frozen
      - run: uv run pytest

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      # npm caching is handled by setup-node against the frontend lockfile.
      - uses: actions/checkout@v5.0.1
      - uses: actions/setup-node@v6.3.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  frontend-test:
    name: Frontend test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      # npm caching is handled by setup-node against the frontend lockfile.
      - uses: actions/checkout@v5.0.1
      - uses: actions/setup-node@v6.3.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:run
      - run: npm run build
