name: CI

on:
  push:
    branches: ["main"]
    # Docs-only changes skip the build entirely — nothing in CI reads these paths, and a skipped
    # main run publishes nothing, which is right: prose changes ship no image. Title check still
    # runs from its own workflow.
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    branches: ["main"]
    # Keep in step with the push list above.
    paths-ignore: ["docs/**", "**.md"]
  # The only way to publish images for a commit whose own run never happened: a webhook dropped
  # during an Actions incident triggers nothing, and no event replays itself afterwards.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a main run: cancellation mid-publish could leave :latest half-moved,
  # which is exactly the out-of-step image pair the publish job exists to prevent.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Actions bills each job rounded up to a full minute, so ten small jobs cost twice their actual
# compute. Steps are grouped into few jobs deliberately; resist splitting one out for tidiness.

jobs:
  checks:
    name: Repo checks
    runs-on: ubuntu-latest
    # A hung step otherwise bills the 360-minute default.
    timeout-minutes: 10
    env:
      # Nothing bumps these for you — Dependabot tracks neither a curl nor a uvx pin. Move the
      # osv pair together.
      OSV_VERSION: v2.4.0
      OSV_SHA256: 15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
      ZIZMOR_VERSION: "1.19.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step talks to the remote, so no job needs the token sitting in .git/config
          # where every transitive dependency's install hook could read it.
          persist-credentials: false
      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: "1.7.12"
          pyflakes: false
      # Structure only, with dummy values — the smoke job is what proves the stack boots.
      - name: Validate the production Compose file
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
          FRONTEND_BASE_URL: https://example.invalid
          RESEND_API_KEY: ci
          EMAIL_FROM: ci@example.invalid
          REDIS_URL: redis://localhost:6379/0
        run: docker compose -f docker-compose.prod.yml config --quiet
      # `test_observability_coverage.py` reads this file with a regex to avoid a YAML dependency, so
      # nothing there would catch a broken expression or a mis-indented rule — both of which only
      # surface at import time, in a browser, on the deployment host.
      - name: Validate the alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/observability:/w:ro" \
            prom/prometheus:v3.7.3 check rules /w/alerts.yml
      # Registration is open to the internet, so a disclosed CVE is not a "fix it next sprint"
      # item — this gates publish deliberately. A finding with no upstream fix yet is the cost.
      # osv-scanner reads both lockfiles, so neither stack needs installing. Checksum-pinned, so a
      # swapped release binary fails here rather than auditing the audit away.
      - name: Install osv-scanner
        run: |
          set -eu
          curl -fsSLo /tmp/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  /tmp/osv-scanner" | sha256sum -c -
          install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner
      - name: Audit dependency lockfiles
        run: make audit
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          working-directory: backend
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      # actionlint above checks what a workflow says; this checks what it exposes — credential
      # persistence, injection, dangerous triggers. Any finding fails, and --strict-collection
      # keeps an unparseable workflow from being silently skipped as a pass.
      - name: Audit workflow security posture
        run: uvx zizmor=="${ZIZMOR_VERSION}" --strict-collection .github/workflows/
      - run: npm ci
        working-directory: frontend
      - run: uv sync --frozen
        working-directory: backend
      - name: Contract is in sync with the backend schema
        # app.openapi() is schema-only — no DB connection is opened, but Settings() still
        # requires these to be set (no defaults) for app.main to import.
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
          ENVIRONMENT: development
        run: |
          make contracts
          git diff --exit-code frontend/src/api/generated/contract.ts

  backend:
    name: Backend
    runs-on: ubuntu-latest
    # A hung step otherwise bills the 360-minute default.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      # ENVIRONMENT is required (no default) — CI has no .env, so provide it inline.
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step talks to the remote, so no job needs the token sitting in .git/config
          # where every transitive dependency's install hook could read it.
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          working-directory: backend
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run deptry .
      # Integration tests reach Postgres through Testcontainers, which needs the runner's Docker.
      - run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    # A hung step otherwise bills the 360-minute default.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step talks to the remote, so no job needs the token sitting in .git/config
          # where every transitive dependency's install hook could read it.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run knip
      # `tsc --build` (not `--noEmit`): the root tsconfig is a solution file with `files: []`,
      # so a plain `tsc --noEmit` type-checks nothing and always passes. `vite build` is
      # transpile-only, so this is the only step that actually checks types. The bundle itself is
      # built by the images job, so nothing here needs to run vite.
      - run: npm run typecheck
      - run: npm run test:run

  # Builds both production images, then the only check that sees them serving together: a broken
  # Caddy upstream, a failed migration on boot or a missing bundle only shows here. Assertions
  # mirror invariants that have actually broken in production — see ADR-019, docs/runbooks/deploy.md.
  images:
    name: Images & smoke
    runs-on: ubuntu-latest
    # A hung step otherwise bills the 360-minute default.
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@db:5432/ci
      FRONTEND_BASE_URL: http://localhost:8080
      RESEND_API_KEY: ci-smoke
      EMAIL_FROM: ci@example.invalid
      REDIS_URL: redis://redis:6379/0
      # Read natively by every `docker compose` call below, so no step repeats the -f pair.
      COMPOSE_FILE: docker-compose.prod.yml:docker-compose.smoke.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step talks to the remote, so no job needs the token sitting in .git/config
          # where every transitive dependency's install hook could read it.
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      # Every build sets `pull: true`, because the bases are floating tags: the layer cache would
      # otherwise hold a build to whichever base it first resolved, reintroducing the very drift
      # dropping the digests was meant to end.
      - name: Build backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          file: backend/Dockerfile.prod
          push: false
          pull: true
          load: true
          tags: frontdashboard-backend:ci
          cache-from: type=gha,scope=frontdashboard-backend
          cache-to: type=gha,mode=max,scope=frontdashboard-backend
      - name: Build frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: frontend/Dockerfile.prod
          push: false
          pull: true
          load: true
          tags: frontdashboard-frontend:ci
          cache-from: type=gha,scope=frontdashboard-frontend
          cache-to: type=gha,mode=max,scope=frontdashboard-frontend
      # A USER line is easy to drop in a refactor and nothing else would notice, so assert it. The
      # frontend is the more fragile of the two: it binds :80 holding no capability at all, so
      # losing the USER line is what would silently return it to root.
      - name: Assert the production images do not run as root
        run: |
          set -eu
          for image in frontdashboard-backend:ci frontdashboard-frontend:ci; do
            uid=$(docker run --rm "$image" id -u)
            echo "$image runs as uid $uid"
            test "$uid" != "0"
          done

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for readiness through the proxy
        # Proves three things at once: Caddy resolves its upstream, the backend finished
        # `alembic upgrade head`, and it can reach the database.
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8080/api/health/ready; then
              echo "ready"
              exit 0
            fi
            sleep 2
          done
          echo "backend never became ready"
          exit 1

      - name: Rate limit windows land in Redis, not in the worker
        # The only check here that fails if `storage_uri` is dropped: nothing else in the stack
        # writes to Redis, and everything else passes just as well on per-process limits.
        run: |
          set -eu
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"nobody@example.com","password":"not-a-real-password"}')
          echo "login probe returned $code"
          keys=$(docker compose exec -T redis redis-cli --scan --pattern '*frontdashboard*' | wc -l)
          echo "rate-limit keys in redis: $keys"
          test "$keys" -gt 0

      - name: Caddy serves holding no capability
        # The base image's binary ships one; stripping it is what leaves :80 bound on the sysctl
        # alone. Nothing else would notice it returning — the container still serves, 74 MB heavier.
        run: |
          set -eu
          caps=$(docker compose exec -T frontend grep CapPrm /proc/1/status | awk '{print $2}' | tr -d '\r')
          echo "frontend PID 1 CapPrm=$caps"
          test "$caps" = "0000000000000000"

      - name: Document is served uncached, with its security headers
        run: |
          set -eu
          curl -fsS -D headers.txt -o doc.html http://localhost:8080/
          # Absent means browsers guess a lifetime from Last-Modified and a stale document asks
          # for bundles the deploy deleted.
          grep -qi '^cache-control: no-cache' headers.txt
          grep -qi '^content-security-policy: ' headers.txt
          grep -qi '^x-frame-options: DENY' headers.txt
          grep -qi '^x-content-type-options: nosniff' headers.txt
          grep -qi '^strict-transport-security: ' headers.txt

      - name: Bundle the document names is reachable and is JavaScript
        # A 200 of text/html here is the silent blank page: the browser parses the SPA fallback as
        # a module and renders nothing.
        run: |
          set -eu
          bundle=$(grep -oE '/assets/[^"]+\.js' doc.html | head -1)
          test -n "$bundle"
          type=$(curl -fsS -o /dev/null -w '%{content_type}' "http://localhost:8080$bundle")
          echo "$bundle is $type"
          case "$type" in
            text/javascript*|application/javascript*) ;;
            *) echo "bundle is not JavaScript"; exit 1 ;;
          esac
          curl -fsSI -o asset-headers.txt "http://localhost:8080$bundle"
          grep -qi 'cache-control: .*immutable' asset-headers.txt

      - name: Missing bundle 404s instead of falling back to the document
        run: |
          set -eu
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/assets/index-DELETED.js)
          echo "deleted asset returned $code"
          test "$code" = "404"

      - name: Unknown path falls back to the SPA
        run: |
          set -eu
          curl -fsS -o notfound.html http://localhost:8080/not-a-real-page
          grep -q '<div id="root">' notfound.html

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down

  # Publish, not deploy: images land in GHCR as a matched pair; prod still pulls by hand.
  # Both images build before any tag is pushed, and :sha goes before :latest, so no failure
  # order can leave :latest pointing at images from two different commits.
  publish:
    name: Publish images
    # `workflow_dispatch` is here or the manual trigger would rebuild everything and publish
    # nothing, which is the one thing it exists for. The ref check still gates it to main, so
    # dispatching from a branch runs the checks and skips this.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [checks, backend, frontend, images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/frontdashboard-backend
      FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/frontdashboard-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step talks to the remote, so no job needs the token sitting in .git/config
          # where every transitive dependency's install hook could read it.
          persist-credentials: false
      - name: Resolve the short sha tag
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Rebuilds are near-free: cache-from reuses the layer cache the images job wrote.
      - name: Build backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          file: backend/Dockerfile.prod
          push: false
          pull: true
          load: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=frontdashboard-backend
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: frontend/Dockerfile.prod
          push: false
          pull: true
          load: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=frontdashboard-frontend
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Push the matched pair
        env:
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          docker push "${BACKEND_IMAGE}:${SHA}"
          docker push "${FRONTEND_IMAGE}:${SHA}"
          docker push "${BACKEND_IMAGE}:latest"
          docker push "${FRONTEND_IMAGE}:latest"
          {
            echo "### Images published"
            echo
            echo "- \`${BACKEND_IMAGE}:${SHA}\` (and \`:latest\`)"
            echo "- \`${FRONTEND_IMAGE}:${SHA}\` (and \`:latest\`)"
          } >> "$GITHUB_STEP_SUMMARY"
