name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a main run: cancellation mid-publish could leave :latest half-moved,
  # which is exactly the out-of-step image pair the publish job exists to prevent.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  workflow:
    name: Workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: "1.7.12"
          pyflakes: false
      # The prod stack is never exercised by CI otherwise, so a typo in it surfaces at deploy.
      # Values are dummies: this validates structure, not configuration.
      - name: Validate the production Compose file
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
          FRONTEND_BASE_URL: https://example.invalid
          RESEND_API_KEY: ci
          EMAIL_FROM: ci@example.invalid
        run: docker compose -f docker-compose.prod.yml config --quiet

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      # ENVIRONMENT is required (no default) — CI has no .env, so provide it inline.
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          working-directory: backend
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run deptry .
      - run: uv run pytest
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      # The frontend prod image was already built here; the backend one never was, so a broken
      # Dockerfile.prod only surfaced at deploy time. Same job, no extra runner.
      - name: Build production backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          file: backend/Dockerfile.prod
          push: false
          load: true
          tags: frontdashboard-backend:ci
          cache-from: type=gha,scope=frontdashboard-backend
          cache-to: type=gha,mode=max,scope=frontdashboard-backend
      # A USER line is easy to drop in a refactor and nothing else would notice, so assert it.
      - name: Assert the production image does not run as root
        run: |
          uid=$(docker run --rm frontdashboard-backend:ci id -u)
          echo "production image runs as uid $uid"
          test "$uid" != "0"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run knip
      # `tsc --build` (not `--noEmit`): the root tsconfig is a solution file with `files: []`,
      # so a plain `tsc --noEmit` type-checks nothing and always passes. `vite build` is
      # transpile-only, so this is the only step that actually checks types.
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
      # Folded in from a separate job: this needs both toolchains, and the frontend job is the
      # shorter of the two, so uv lands here rather than npm ci landing on the backend job.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          working-directory: backend
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --frozen
        working-directory: backend
      - name: Contract is in sync with the backend schema
        # app.openapi() is schema-only — no DB connection is opened, but Settings() still
        # requires these to be set (no defaults) for app.main to import.
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
          ENVIRONMENT: development
        working-directory: .
        run: |
          make contracts
          git diff --exit-code frontend/src/api/generated/contract.ts
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build production frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: frontend/Dockerfile.prod
          push: false
          load: true
          tags: frontdashboard-frontend:ci
          cache-from: type=gha,scope=frontdashboard-frontend
          cache-to: type=gha,mode=max,scope=frontdashboard-frontend
      # Mirrors the backend assertion. This image is the more fragile of the two: it binds :80 via
      # a file capability, so losing either the USER line or the setcap silently returns it to root.
      - name: Assert the production image does not run as root
        run: |
          uid=$(docker run --rm frontdashboard-frontend:ci id -u)
          echo "production image runs as uid $uid"
          test "$uid" != "0"

  # Publish, not deploy: images land in GHCR as a matched pair; prod still pulls by hand.
  # Both images build before any tag is pushed, and :sha goes before :latest, so no failure
  # order can leave :latest pointing at images from two different commits.
  publish:
    name: Publish images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [workflow, backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/frontdashboard-backend
      FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/frontdashboard-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the short sha tag
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Rebuilds are near-free: cache-from reuses the layer cache the test jobs just wrote.
      - name: Build backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          file: backend/Dockerfile.prod
          push: false
          load: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=frontdashboard-backend
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: frontend/Dockerfile.prod
          push: false
          load: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=frontdashboard-frontend
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Push the matched pair
        env:
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          docker push "${BACKEND_IMAGE}:${SHA}"
          docker push "${FRONTEND_IMAGE}:${SHA}"
          docker push "${BACKEND_IMAGE}:latest"
          docker push "${FRONTEND_IMAGE}:latest"
          {
            echo "### Images published"
            echo
            echo "- \`${BACKEND_IMAGE}:${SHA}\` (and \`:latest\`)"
            echo "- \`${FRONTEND_IMAGE}:${SHA}\` (and \`:latest\`)"
          } >> "$GITHUB_STEP_SUMMARY"
