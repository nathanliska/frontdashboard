version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions:
        applies-to: "version-updates"
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "backend"
    groups:
      backend:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Majors arrive as one PR rather than one each: they are reviewed as a batch anyway, and
      # ungrouped they accumulate. Declining one means an `ignore` entry, which regroups the rest.
      backend-major:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "major"
      backend-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "frontend"
    # We depend on react-resizable only for the stylesheet that styles react-grid-layout's handles,
    # so its major must follow that library's rather than lead it — leading installs a second copy.
    ignore:
      - dependency-name: "react-resizable"
        update-types:
          - "version-update:semver-major"
    groups:
      react:
        applies-to: "version-updates"
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      frontend:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Listed after `react`, which claims its own packages at every level and must keep doing so.
      frontend-major:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "major"
      frontend-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  # Base images float by tag, so patch-level fixes arrive on the next rebuild rather than as a PR
  # here. What these entries still catch is a tag that stops moving — a new major, or a distro
  # release the floating tag will never reach on its own.
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker:
        patterns:
          - "*"
