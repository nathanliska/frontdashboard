[project]
name = "frontdashboard-backend"
version = "0.1.0"
description = "FrontDashboard backend API"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    # Not uvicorn[standard]: that pulls websockets (this app is SSE-only per ADR-004),
    # PyYAML and watchfiles, none of which run in production. The two extras that do matter
    # are named explicitly and uvicorn picks them up automatically.
    "uvicorn>=0.52.0",
    "uvloop>=0.22.1",
    "httptools>=0.8.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.29.0",
    "alembic>=1.18.5",
    "argon2-cffi>=23.1.0",
    "slowapi>=0.1.10",
    "email-validator>=2.1.0",
    "pydantic>=2.13.3",
    "sse-starlette>=3.4.6",
    "pydantic-settings>=2.14.2",
    "anyio>=4.14.2",
    "prometheus-client>=0.26.0",
    # Also the test client. Runtime because outbound email posts through it — which brings certifi,
    # so outbound TLS now trusts a bundled CA set rather than the base image's.
    "httpx>=0.27.0",
    "redis>=6.0.0",
]

[dependency-groups]
dev = [
    "deptry>=0.23.1",
    "ruff>=0.16.0",
    "ty>=0.0.66",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "testcontainers>=4.15.0",
    # `uvicorn --reload` in Dockerfile (dev) needs this; the production image does not.
    "watchfiles>=1.2.0",
]

[tool.ruff]
target-version = "py314"
line-length = 150
extend-exclude = ["alembic/versions"]
force-exclude = true

[tool.ruff.lint]
# D2/D4 enforce PEP 257 docstring shape; D1 is absent, so nothing mandates a docstring exist.
select = ["E", "F", "I", "UP", "B", "SIM", "D2", "D4"]
# B008: FastAPI requires Depends() calls in function signatures — this is intentional.
# D401: predicates and properties read better as noun phrases than forced imperatives.
ignore = ["B008", "D401"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"app/services/email_templates.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# A guard that parametrizes over a discovery walk must fail when the walk finds nothing; the
# default skips, which exits 0 and reads as a satisfied build.
empty_parameter_set_mark = "fail_at_collect"
testpaths = ["tests"]
markers = [
    "unit: does not require PostgreSQL or Docker",
    "integration: requires PostgreSQL through TEST_DATABASE_URL or Testcontainers",
]

[tool.ty]
environment.python-version = "3.14"

[tool.uv]
constraint-dependencies = [
    "urllib3>=2.7.0",
]

[tool.deptry.per_rule_ignores]
# Runtime plumbing selected by configuration rather than imported in our code.
DEP002 = ["uvicorn", "uvloop", "httptools", "asyncpg", "email-validator"]
