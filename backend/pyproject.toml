[project]
name = "frontdashboard-backend"
version = "0.1.0"
description = "FrontDashboard backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.2",
    # Not uvicorn[standard]: that pulls websockets (this app is SSE-only per ADR-004),
    # PyYAML and watchfiles, none of which run in production. The two extras that do matter
    # are named explicitly and uvicorn picks them up automatically.
    "uvicorn>=0.46.0",
    "uvloop>=0.22.1",
    "httptools>=0.7.1",
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.29.0",
    "alembic>=1.18.5",
    "PyJWT>=2.13.0",
    "argon2-cffi>=23.1.0",
    "slowapi>=0.1.10",
    "email-validator>=2.1.0",
    "pydantic>=2.13.3",
    "sse-starlette>=3.4.5",
    "pydantic-settings>=2.14.2",
    "anyio>=4.13.0",
]

[dependency-groups]
dev = [
    "deptry>=0.23.1",
    "ruff>=0.15.22",
    "ty>=0.0.60",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.27.0",
    "testcontainers>=4.0.0",
    # `uvicorn --reload` in Dockerfile (dev) needs this; the production image does not.
    "watchfiles>=1.1.1",
]

[tool.ruff]
target-version = "py312"
line-length = 150
extend-exclude = ["alembic/versions"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI requires Depends() calls in function signatures — this is intentional
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/services/email_templates.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: does not require PostgreSQL or Docker",
    "integration: requires PostgreSQL through TEST_DATABASE_URL or Testcontainers",
]

[tool.ty]
environment.python-version = "3.12"

[tool.uv]
constraint-dependencies = [
    "urllib3>=2.7.0",
]

[tool.deptry.per_rule_ignores]
# Runtime plumbing selected by configuration rather than imported in our code.
DEP002 = ["uvicorn", "uvloop", "httptools", "asyncpg", "email-validator"]
