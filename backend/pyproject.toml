[project]
name = "frontdashboard-backend"
version = "0.1.0"
description = "FrontDashboard backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.29.0",
    "alembic>=1.18.5",
    "PyJWT>=2.0.0",
    "argon2-cffi>=23.1.0",
    "slowapi>=0.1.10",
    "email-validator>=2.1.0",
    "pydantic>=2.13.3",
    "sse-starlette>=3.4.5",
    "pydantic-settings>=2.14.2",
]

[dependency-groups]
dev = [
    "deptry>=0.23.1",
    "ruff>=0.15.22",
    "ty>=0.0.60",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.27.0",
    "testcontainers>=4.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 150
extend-exclude = ["alembic/versions"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI requires Depends() calls in function signatures — this is intentional
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/services/email_templates.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ty]
environment.python-version = "3.12"

[tool.uv]
constraint-dependencies = [
    "urllib3>=2.7.0",
]

[tool.deptry.per_rule_ignores]
DEP002 = ["uvicorn", "asyncpg", "email-validator"]
