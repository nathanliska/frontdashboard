[project]
name = "frontdashboard-backend"
version = "0.1.0"
description = "FrontDashboard backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "python-jose[cryptography]>=3.3.0",
    "argon2-cffi>=23.1.0",
    "slowapi>=0.1.9",
    "email-validator>=2.1.0",
    "pydantic>=2.13.3",
    "sse-starlette>=2.1.0",
    "pydantic-settings>=2.3.0",
]

[dependency-groups]
dev = [
    "deptry>=0.23.1",
    "ruff>=0.15.12",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "testcontainers>=4.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 150
extend-exclude = ["alembic/versions"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI requires Depends() calls in function signatures — this is intentional
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.deptry.per_rule_ignores]
DEP002 = ["uvicorn", "asyncpg", "email-validator"]
