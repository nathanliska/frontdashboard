default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The generated API contract is compared byte-for-byte against `make contracts`
      # output in CI — a hook that rewrites it would fail that gate on every change.
      - id: trailing-whitespace
        exclude: ^frontend/src/api/generated/
      - id: end-of-file-fixer
        exclude: ^frontend/src/api/generated/
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - refactor
          - chore
          - test
          - ci
          - perf
          - style
          - build
          - revert

  - repo: local
    hooks:
      - id: normalize-commit-msg
        name: normalize commit message
        entry: scripts/normalize-commit-msg.sh
        language: script
        stages: [prepare-commit-msg]
        always_run: true

      - id: biome-check
        name: biome check (frontend)
        entry: scripts/run-biome-check.sh
        language: script
        files: ^frontend/.*\.(ts|tsx|js|jsx|json|css)$

      - id: deptry
        name: deptry (backend)
        entry: bash -c 'cd backend && uv run python -m deptry .'
        language: system
        files: ^backend/.*\.py$|^backend/pyproject\.toml$
        pass_filenames: false
