services:
  frontend:
    # Context is the repo root, matching Dockerfile.prod: Docker reads the ignore file at the
    # context root, so building `./frontend` instead would leave the root .dockerignore governing
    # only the prod image and ship 428MB of host node_modules into this one.
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend-venv:/app/.venv
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:5173}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-FrontDashboard <onboarding@resend.dev>}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # No published port: unauthenticated by design, so reachable only on the compose network.
  redis:
    image: valkey/valkey:9-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    # Deliberately not in .env.example: a value copied into a developer's .env would override this
    # default and silently keep that machine on an old major version after everyone else moved.
    # The default here and tests/conftest.py's are asserted equal by tests/test_config.py.
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-frontdash}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-frontdash}
      - POSTGRES_DB=${POSTGRES_DB:-frontdashboard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-frontdash} -d ${POSTGRES_DB:-frontdashboard}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  backend-venv:
  frontend-node-modules:
